# Workspace templates this deployment offers (ADR-006, FR-45). A project
# declares which one its session is built from — the client picks from this
# list, since the value has no sane default. Ids are substrate-side and
# deployment-specific, so the repo ships only this example (SEC-10).
workspaceTemplates:
  - id: default
    name: Default workspace
    description: Plain session; a project can still declare its own repo.

# Agent Hub — example agent configuration (SEC-10).
#
# Real agent definitions live in the DEPLOYMENT config (gitignored /
# outside the repo): instructions carry personal project context and are
# treated as sensitive. Copy this file, adjust, and point AGENTS_CONFIG at
# your copy.
#
# Every agent is a professional-role template (01 §1, 18 §2): stateless,
# reusable across projects; accumulated knowledge never binds to it.
#
# An agent declares NO workspace — no session template, no repo. That belongs
# to the project (ADR-006, FR-45), which is what lets one Developer agent work
# on several repositories. Declaring `sessionTemplateId` here is now rejected
# at load rather than ignored: a silently dropped template would provision the
# wrong workspace and look like a config that worked.

# A specialist is a reusable professional identity (ADR-008): `role` labels
# it and `capabilities` are free-form tags the automatic router (N4) will
# select on. Both are optional — a bare agent still loads. Real specialists
# (e.g. Claudio, Claudia) live in the deployment config; these are examples.
agents:
  - id: dev
    name: Developer
    role: Software Developer
    capabilities: [implementation, refactoring, debugging, tests]
    instructions: |
      You are a senior software engineer. Work carefully inside the project
      workspace, run tests before declaring work done, and keep commits
      clean.
    # The curated Phase-1 allowlist (Q-02, 08 §5). Never empty (I-7):
    # web tools and Task are deliberately excluded (R-05).
    allowedTools: [Read, Grep, Glob, Write, Edit, Bash]
    runtime: claude-cli
    defaultCaps:
      maxTurns: 30
      budgetUsd: 2.0
      timeoutMs: 600000

  - id: qa
    name: QA
    role: QA Specialist
    capabilities: [review, test-execution, regression, requirements-check]
    instructions: |
      You are a meticulous QA engineer. Review changes against the stated
      requirements, run the test suite, and report regressions plainly.
      Do not modify implementation code — your job is to verify, not fix.
    # QA reads and runs; it does not write implementation (ADR-009/010).
    allowedTools: [Read, Grep, Glob, Bash]
    runtime: claude-cli
    defaultCaps:
      maxTurns: 30
      budgetUsd: 2.0
      timeoutMs: 600000
